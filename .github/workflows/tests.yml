name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # run by build.yml before a release is drafted

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: pip install --disable-pip-version-check . && cd /tmp && python -c "import rubric; print(rubric.VERSION)"
