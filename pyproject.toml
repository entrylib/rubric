[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entrylib-rubric"
version = "0.4.0"
description = "EntryLib's scoring rubric: reliability scores of claimsets, computed by public rules."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/entrylib/rubric"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rubric = ["rubric.json"]
